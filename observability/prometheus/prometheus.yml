global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # 应用跑在宿主机（bun dev / bun start），容器通过 host.docker.internal 访问。
  - job_name: dunx-boot
    metrics_path: /api/metrics/openmetrics
    static_configs:
      - targets: ['host.docker.internal:3000']
