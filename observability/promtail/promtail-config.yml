server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 应用日志按天轮转（logs/app-*.log），这里把仓库的 ./logs 挂进容器。
  - job_name: dunx-boot
    static_configs:
      - targets: [localhost]
        labels:
          job: dunx-boot
          __path__: /var/log/dunx/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            trace_id: traceId
            timestamp: timestamp
            message: message
      - labels:
          level:
          trace_id:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
